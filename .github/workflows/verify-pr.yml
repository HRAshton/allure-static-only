name: Lightweight PR gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lightweight-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: source-and-reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Fast source, converter, SDK and release-manifest tests
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          npm run build:sdk
          npm run test:sdk-package
      - name: REUSE license and copyright compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
