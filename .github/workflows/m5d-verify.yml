name: M5d installed SDK in real Allure container acceptance

on:
  push:
    branches:
      - milestone/m5d-installed-sdk-host

permissions:
  contents: read

concurrency:
  group: m5d-installed-sdk-host
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Strict API and independent package consumer gates
        run: |
          npm ci
          npm run verify
          npm run build:sdk
          npm run test:sdk-package
      - name: Build installed-SDK custom host and test real Chromium import
        run: docker build -f examples/company-adapter/Dockerfile -t allure-static-sdk-acceptance .
      - name: Nginx-only image static security and assets
        run: |
          docker run -d --rm --name allure-sdk-acceptance -p 127.0.0.1:18086:80 allure-static-sdk-acceptance
          trap 'docker stop allure-sdk-acceptance' EXIT
          for n in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18086/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:18086/ | grep -qi 'content-security-policy:'
          curl -fsS http://127.0.0.1:18086/demo/company-sample.json | grep -q 'acme.test-report.v1'
          curl -fsSI http://127.0.0.1:18086/bootstrap.mjs | grep -qi 'content-type: text/javascript'
