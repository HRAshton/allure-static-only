name: M6a static CSP browser and Nginx acceptance

on:
  push:
    branches:
      - milestone/m6a-static-csp

permissions:
  contents: read

concurrency:
  group: m6a-static-security
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Biome, architecture boundaries, TypeScript and unit tests
        run: |
          npm ci
          npm run verify
      - name: Build pinned upstream Allure and static import fixtures
        run: |
          npm run build:upstream
          node scripts/prepare-fixture.mjs
          node scripts/prepare-m3-fixture.mjs
          (cd .allure-workspace/m1-fixture-results && zip -q ../m3-fixture.zip *-result.json)
          (cd .allure-workspace/m3-complex-results && zip -q ../m3-complex.zip *)
      - name: Chromium smoke with enforcing CSP on all report formats
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/smoke-browser.mjs
      - name: Verify Nginx static headers and MIME in actual container
        run: |
          test -f dist/bootstrap.mjs
          docker run -d --rm --name allure-static-m6a -p 127.0.0.1:18082:80 \
            -v "$PWD/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          trap 'docker stop allure-static-m6a' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18082/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:18082/ | grep -qi "content-security-policy:"
          curl -fsSI http://127.0.0.1:18082/ | grep -qi "x-content-type-options: nosniff"
          curl -fsSI http://127.0.0.1:18082/ | grep -qi "x-frame-options: DENY"
          curl -fsSI http://127.0.0.1:18082/bootstrap.mjs | grep -qi "content-type: text/javascript"
          curl -fsS http://127.0.0.1:18082/bootstrap.mjs | grep -q "allureReportOptions"
