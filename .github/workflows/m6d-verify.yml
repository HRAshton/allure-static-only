name: M6d cancellation and import budget acceptance

on:
  push:
    branches:
      - milestone/m6d-import-budgets

permissions:
  contents: read

concurrency:
  group: m6d-import-budgets
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Strict checks and cancellation regressions
        run: |
          npm ci
          npm run verify
      - name: Large report memory and time ceiling
        run: npm run bench:import
