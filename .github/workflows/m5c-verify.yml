name: M5c standalone SDK pack/install acceptance

on:
  push:
    branches:
      - milestone/m5c-packable-sdk

permissions:
  contents: read

concurrency:
  group: m5c-packable-sdk
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Strict project tests
        run: |
          npm ci
          npm run verify
      - name: Emit versioned SDK and verify independent offline consumer
        run: |
          npm run build:sdk
          npm run test:sdk-package
